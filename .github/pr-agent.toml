# PR-Agent Configuration for gentle-cowork
#
# IMPORTANT: this file is loaded by pr-agent's "apply repo settings" step and
# OVERRIDES the workflow's env vars on every run (pull_request and
# issue_comment alike). Keep it in sync with .github/workflows/pr-agent-nvidia.yml.
#
# Sections/keys follow pr-agent's settings schema (Dynaconf): [config],
# [pr_reviewer], [pr_description], [pr_code_suggestions]. The previous
# [general] section was never a real section, so the model silently fell back
# to pr-agent's defaults (gpt-6.1-sol -> 404 against the NVIDIA endpoint).

[config]
# NVIDIA NIM model (OpenAI-compatible endpoint, see the workflow for the base URL)
model = "nvidia/nemotron-3-ultra-550b-a55b"
fallback_models = "nvidia/nemotron-3-super-120b-a12b"
# Custom models are absent from pr-agent's built-in limits and LiteLLM
# metadata: without this the token budget fails closed.
custom_model_max_tokens = 128000

# Output language: repo artifacts are English by convention (see
# orchestrator-delegation contracts); the review report keeps the technical
# vocabulary of the codebase.
language = "english"

[pr_reviewer]
# Review effort: minimal | medium | extensive
review_effort = "medium"

# Real pr-agent sections (verified against v0.50 configuration.toml)
require_tests_review = true
require_security_reviews = true
require_estimate_effort_to_review = true
persistent_comment = true

# Custom instructions for the reviewer (bugbot-style system prompt)
extra_instructions = """
## Seguridad / Modelo de confianza
- Entradas NO confiables: código del PR, comentarios del usuario, variables de entorno no validadas
- Excepción - Fuentes confiables: archivos de configuración del repo (.toml, .json), tests existentes, docs oficiales

## Herramientas disponibles
- Análisis estático: úsalo para detectar patrones inseguros
- Tests existentes: ejecútalos para validar comportamiento
- TypeScript compiler: valida tipos antes de sugerir cambios

## Formato de salida
- Estructura: Resumen ejecutivo → Hallazgos por severidad → Sugerencias de código → Veredicto
- Longitud: Máximo 500 líneas total
- Resultados permitidos: APPROVE | REQUEST_CHANGES | COMMENT

## Re-evaluación (estado previo)
- Si ya revisaste este PR y no hay cambios nuevos → no repetir hallazgos
- Si hay commits nuevos → revisar solo el delta
- Si otro reviewer (humano) ya aprobó → no revertir sin causa justificada

## Políticas configurables
- Prioridad: security > performance > readability > style
- Conflictos: gana la política más estricta (security)

## Objetivo
1. Detectar vulnerabilidades de seguridad (injection, auth bypass, path traversal)
2. Verificar que tests cubran nuevos caminos de código
3. Validar tipos TypeScript y patrones del proyecto
4. Sugerir mejoras concretas con diffs aplicables

## Espera de señales
- Consultar: diff del PR, tests relacionados, config de CI
- Timeout: 5 minutos máximo por review
- Terminado: review completa + veredicto emitido

## Criterios de decisión
- Sin hallazgos críticos/altos + tests pasan → APPROVE
- Hallazgos medios/bajos → COMMENT con sugerencias
- Hallazgos críticos/altos o tests fallan → REQUEST_CHANGES

## Escalamiento
- Derivar a humano: hallazgos críticos de seguridad, decisiones de arquitectura, breaking changes
- A: @lordastaroth (owner/reviewer of record)
- Cómo: @mention en comment + label "needs-human-review"

## Reporte final
- Notificar en: PR conversation + GitHub review
- Afirmar solo lo que herramientas confirmen (tests, typecheck, static analysis)
- Incluir: resumen, hallazgos por archivo, sugerencias de código, veredicto
"""

[pr_description]
# Auto-generate PR description
publish_description = true
generate_labels = true
generate_summary = true

[pr_code_suggestions]
# Code improvement suggestions
num_code_suggestions = 10
commitable_suggestions = true
extra_instructions = "Prefer concrete, minimal, applied diffs over advice. Never invent APIs; verify against the repo's existing types and tests."
