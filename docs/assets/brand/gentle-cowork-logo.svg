<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c44569;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b1e3f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#roseGradient)" opacity="0.15"/>
  
  <!-- Outer decorative ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#roseGradient)" stroke-width="2" opacity="0.3"/>
  
  <!-- Central rose flower -->
  <g filter="url(#glow)">
    <!-- Petals back layer -->
    <g fill="url(#roseGradient)" opacity="0.9">
      <ellipse cx="60" cy="35" rx="18" ry="28" transform="rotate(-45 60 35)"/>
      <ellipse cx="60" cy="35" rx="18" ry="28" transform="rotate(45 60 35)"/>
      <ellipse cx="60" cy="85" rx="18" ry="28" transform="rotate(-45 60 85)"/>
      <ellipse cx="60" cy="85" rx="18" ry="28" transform="rotate(45 60 85)"/>
      <ellipse cx="35" cy="60" rx="28" ry="18" transform="rotate(-45 35 60)"/>
      <ellipse cx="35" cy="60" rx="28" ry="18" transform="rotate(45 35 60)"/>
      <ellipse cx="85" cy="60" rx="28" ry="18" transform="rotate(-45 85 60)"/>
      <ellipse cx="85" cy="60" rx="28" ry="18" transform="rotate(45 85 60)"/>
    </g>
    
    <!-- Petals front layer -->
    <g fill="url(#roseGradient)" opacity="1">
      <ellipse cx="60" cy="45" rx="14" ry="22" transform="rotate(-30 60 45)"/>
      <ellipse cx="60" cy="45" rx="14" ry="22" transform="rotate(30 60 45)"/>
      <ellipse cx="60" cy="75" rx="14" ry="22" transform="rotate(-30 60 75)"/>
      <ellipse cx="60" cy="75" rx="14" ry="22" transform="rotate(30 60 75)"/>
      <ellipse cx="45" cy="60" rx="22" ry="14" transform="rotate(-30 45 60)"/>
      <ellipse cx="45" cy="60" rx="22" ry="14" transform="rotate(30 45 60)"/>
      <ellipse cx="75" cy="60" rx="22" ry="14" transform="rotate(-30 75 60)"/>
      <ellipse cx="75" cy="60" rx="22" ry="14" transform="rotate(30 75 60)"/>
    </g>
    
    <!-- Center -->
    <circle cx="60" cy="60" r="16" fill="url(#goldGradient)"/>
    <circle cx="60" cy="60" r="12" fill="#fff8e7" opacity="0.3"/>
    
    <!-- Inner stigma -->
    <g fill="#ffd700">
      <circle cx="60" cy="60" r="6"/>
      <circle cx="56" cy="56" r="2"/>
      <circle cx="64" cy="56" r="2"/>
      <circle cx="56" cy="64" r="2"/>
      <circle cx="64" cy="64" r="2"/>
    </g>
  </g>
  
  <!-- Subtle sparkles -->
  <g fill="#ffd700" opacity="0.8">
    <polygon points="25,25 27,30 32,30 28,33 30,38 25,35 20,38 22,33 18,30 23,30"/>
    <polygon points="95,25 97,30 102,30 98,33 100,38 95,35 90,38 92,33 88,30 93,30" transform="scale(0.6 0.6) translate(30,10)"/>
    <polygon points="25,95 27,100 32,100 28,103 30,108 25,105 20,108 22,103 18,100 23,100" transform="scale(0.5 0.5) translate(15,55)"/>
    <polygon points="95,95 97,100 102,100 98,103 100,108 95,105 90,108 92,103 88,100 93,100" transform="scale(0.4 0.4) translate(70,80)"/>
  </g>
  
  <!-- "GC" monogram subtle -->
  <text x="60" y="65" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="url(#goldGradient)" text-anchor="middle" opacity="0.4">GC</text>
</svg>